<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="profile.css">
    <title>PROFILE</title>
</head>
<body>
    <div class="app">
        <input type="checkbox" id="menu-toggle">

        <div class="sidebar">
            <label for="menu-toggle" class="menu-btn">
                <i class="fa-solid fa-bars"></i>
            </label>

            <div class="menu-items">
                <a href="dashboard.html" class="icon-btn"><i class="fa-solid fa-xmark"></i></a>
                <a href="profile.html" class="icon-btn"><i class="fa-solid fa-user"></i></a>
                <a href="floor.html" class="icon-btn"><i class="fa-solid fa-house"></i></a>
                <a href="settings.html" class="icon-btn"><i class="fa-solid fa-gear"></i></a>
            </div>
        </div>

        <div class="content">
            <div class="header">
                <i class="fa-solid fa-user"></i>
            </div>

            <div class="avatar">
                <i class="fa-solid fa-user"></i>
            </div>

            <input type="text" placeholder="Name">
            <input type="text" placeholder="Email">
            <input type="password" placeholder="Password">
            <input type="text" placeholder="Phone number">

            <div class="button-group">
                <button class="update-btn">UPDATE</button>
                <button class="signout-btn">SIGN OUT</button>
            </div>
        </div>
    </div>
</body>
</html>
