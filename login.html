<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="CSS/login.css">

</head>
<body>
    <div class="login-wrapper">
        <section class="icon-section">
            <p>Login to continue</p>
            <i class="bi bi-person-circle"></i>
        </section>
        
        <section class="logincontainer">
            <form id="loginForm" action="tenanthome.html">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" placeholder="input your email" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="input your password" required>
                </div>
                <button type="submit" class="submitbtn">Log in</button>
                
                <p class="register">
                    Don't have an account? <a href="registration.html">Register</a>
                </p>
            </form>
        </section>
    </div>

</body>
</html>
